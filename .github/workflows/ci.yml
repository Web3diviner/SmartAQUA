name: SmartAQUA CI & Automated Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Pytest Suite (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        working-directory: ./aquadoc
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio anyio httpx

      - name: Run Backend Unit & RAG Tests
        working-directory: ./aquadoc
        env:
          PYTHONPATH: .
        run: |
          pytest tests/test_retrieval_and_grounding.py tests/test_safety_guardrails.py tests/test_config_and_feeding.py tests/test_ingestion.py

  frontend-builds:
    name: Frontend Typecheck & Production Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            aquadoc-web/package-lock.json
            aquadoc-mobile/package-lock.json

      - name: Build Farmer Web Application
        working-directory: ./aquadoc-web
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Build Mobile Application
        working-directory: ./aquadoc-mobile
        run: |
          npm ci
          npm run typecheck
          npm run build
