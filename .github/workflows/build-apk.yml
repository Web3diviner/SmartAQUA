name: Build Android APKs (Flutter & Capacitor)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-flutter-apk:
    name: Build SmartAQUA Flutter APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: ./project/mobile
        run: flutter pub get

      - name: Build Flutter APK (Universal Release)
        working-directory: ./project/mobile
        run: flutter build apk --release

      - name: Upload SmartAQUA Flutter APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartAQUA-Flutter-Release-APK
          path: project/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  build-capacitor-apk:
    name: Build AquaDoc Capacitor APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'aquadoc-mobile/package-lock.json'

      - name: Install dependencies
        working-directory: ./aquadoc-mobile
        run: npm ci

      - name: Build Web Production Assets
        working-directory: ./aquadoc-mobile
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: ./aquadoc-mobile
        run: npx cap sync android

      - name: Make Gradle executable
        working-directory: ./aquadoc-mobile/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: ./aquadoc-mobile/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload AquaDoc Capacitor APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AquaDoc-Capacitor-APK
          path: aquadoc-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
