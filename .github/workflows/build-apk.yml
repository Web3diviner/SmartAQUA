name: Build AquaDoc Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'aquadoc-mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'aquadoc-mobile/package-lock.json'

      - name: Install dependencies
        working-directory: ./aquadoc-mobile
        run: npm ci

      - name: Build Web Production Assets
        working-directory: ./aquadoc-mobile
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: ./aquadoc-mobile
        run: npx cap sync android

      - name: Make Gradle executable
        working-directory: ./aquadoc-mobile/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: ./aquadoc-mobile/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AquaDoc-Mobile-APK
          path: aquadoc-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
