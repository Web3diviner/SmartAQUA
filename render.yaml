services:
  # AquaDoc AI FastAPI Service
  - type: web
    name: aquadoc-api
    runtime: docker
    dockerfilePath: ./aquadoc/Dockerfile
    dockerContext: ./aquadoc
    plan: free
    region: oregon
    healthCheckPath: /internal/v1/health/live
    envVars:
      - key: APP_ENV
        value: development
      - key: GROQ_API_KEY
        sync: false
      - key: AQUADOC_DEV_TOKEN
        generateValue: true
      - key: CORS_ALLOW_ORIGINS
        value: "*"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: EMBEDDING_PROVIDER
        value: hashing
